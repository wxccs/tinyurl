name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: cd web && npm ci && npm run build

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY=tinyurl
          if [ "$GOOS" = "windows" ]; then
            BINARY=tinyurl.exe
          fi
          go build -trimpath \
            -ldflags="-extldflags '-static' \
              -X 'github.com/wxccs/tinyurl/global.Version=${{ github.ref_name }}' \
              -X 'github.com/wxccs/tinyurl/global.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)' \
              -X 'github.com/wxccs/tinyurl/global.GitCommit=${{ github.sha }}'" \
            -o "./${BINARY}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinyurl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tinyurl*

  release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Package binaries
        run: |
          mkdir -p release
          for dir in artifacts/tinyurl-*; do
            name=$(basename "$dir")
            if [ -f "$dir/tinyurl.exe" ]; then
              zip -j "release/${name}.zip" "$dir/tinyurl.exe"
            else
              tar -czf "release/${name}.tar.gz" -C "$dir" tinyurl
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

  docker:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
            SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
